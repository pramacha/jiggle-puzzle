<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jiggle Puzzle</title>
<meta name="description" content="Jiggle Puzzle turns your child's pictures into jigsaw puzzles.">
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --accent: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --accent: #4493f8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
  h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 .5rem; }
  p { margin: 0 0 1rem; }
  .lede { font-size: 1.15rem; color: var(--muted); }
  ul { padding-left: 1.2rem; }
  a { color: var(--accent); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Jiggle Puzzle</h1>
  <p class="lede">Scan a picture and turn it into a jigsaw puzzle your child can solve.</p>
  <p>Everything stays on your device: no accounts, no ads, no tracking.</p>
  <ul>
    <li><a href="privacy-policy">Privacy Policy</a></li>
    <li>Support: <a href="mailto:travelrsdiary@gmail.com">travelrsdiary@gmail.com</a></li>
  </ul>
</main>
</body>
</html>
